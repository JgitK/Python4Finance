[project]
name = "quant-pipeline"
version = "0.1.0"
description = "A Markowitz portfolio pipeline. dbt and DuckDB do the data work. Python does the stats."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Find tests in the tests folder.
testpaths = ["tests"]
# Show short test names and reasons.
addopts = "-ra -q"

[tool.setuptools.packages.find]
include = ["quant*"]
