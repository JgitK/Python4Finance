name: "quant_pipeline"
version: "0.1.0"
config-version: 2

# This project uses the quant_pipeline profile. See profiles.yml.
profile: "quant_pipeline"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Variables hold the strategy parameters. Change a value here to tune the pipeline.
vars:
  # The universe of stocks: sp500, nasdaq, or both. See docs/decisions.md.
  universe: sp500
  # The Parquet file of raw prices. The path is relative to the dbt folder.
  prices_file: "../data/raw_prices.parquet"
  # Risk-free rate for the Sharpe and Sortino ratios. 4.5% per year.
  risk_free_rate: 0.045
  # Trading days in one year. The code annualizes with this number.
  trading_days_per_year: 252
  # The analysis window for the risk metrics. One year of trading days.
  analysis_window: 252
  # Bollinger Band settings.
  bollinger_window: 20
  bollinger_sd: 2
  # Ichimoku settings.
  ichimoku_conversion: 9
  ichimoku_base: 26
  ichimoku_span_b: 52
  ichimoku_displacement: 26
  # A one-day move larger than this limit needs a review. A test lists each
  # such move that is not in the corporate_actions seed.
  large_move_review_limit: 0.5
  # The close of a ticker must not span this factor over the history. Such a
  # span means that the file mixes the prices before and after a split.
  price_span_limit: 1000
  # Screen gates.
  min_trading_days: 400
  min_avg_volume: 100000
  max_daily_volatility: 0.05
  top_n_per_sector: 10
  # The column that ranks the stocks inside each sector: cum_return or
  # sharpe. The screen keeps the top names of each sector by this measure.
  # See decision D22.
  rank_metric: cum_return
  min_ichimoku_score: 2
  # The number of top stocks to show per sector in the sector leaders mart.
  sector_leaders_n: 3

models:
  quant_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  quant_pipeline:
    sp500_membership:
      +column_types:
        ticker: varchar
        start_date: date
        end_date: date
    nasdaq_membership:
      +column_types:
        ticker: varchar
        start_date: date
        end_date: date
    nasdaq_sectors:
      +column_types:
        ticker: varchar
        sector: varchar
    corporate_actions:
      +column_types:
        ticker: varchar
        date: date
        kind: varchar
        note: varchar
    price_data_exclusions:
      +column_types:
        ticker: varchar
        reason: varchar
    stock_sectors:
      +column_types:
        ticker: varchar
        sector: varchar
