version: 2

models:
  - name: fct_prices
    description: The wide price fact table. One row per ticker per day with all indicators.
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: close
        data_tests: [not_null]

  - name: dim_ticker
    description: One row per stock. It holds the sector and the history span.
    columns:
      - name: ticker
        data_tests: [not_null, unique]
      - name: sector
        data_tests: [not_null]

  - name: mart_daily_returns
    description: The daily return of every stock and the benchmark, for the Python layer.
    columns:
      - name: daily_return
        data_tests: [not_null]

  - name: mart_screen_candidates
    description: The screened, ranked candidate stocks for the portfolio.
    columns:
      - name: ticker
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker
      - name: ichimoku_score
        description: Every candidate meets the minimum score, so this is at least 2.
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 3, 4, 5]
      - name: sector_rank
        data_tests: [not_null]

  - name: mart_sector_leaders
    description: The top stocks in each sector by one-year return.
    columns:
      - name: ticker
        data_tests: [not_null]

  - name: mart_screen_history
    description: >
      The screen on each date. Each row is one stock that passed the screen on
      that date, with only the data up to that date. The backtest reads this mart.
    columns:
      - name: as_of_date
        data_tests: [not_null]
      - name: ticker
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ticker')
                field: ticker
      - name: sector_rank
        data_tests: [not_null]

unit_tests:
  - name: test_screen_applies_all_gates
    description: >
      A candidate must pass every gate. This test sends four stocks through
      the screen. Only the stock that passes all gates stays.
    model: mart_screen_candidates
    given:
      - input: ref('int_risk_metrics')
        rows:
          # PASS: meets every gate.
          - {ticker: PASS, total_trading_days: 500, avg_volume: 1000000,
             daily_volatility: 0.02, annual_return: 0.30, annual_volatility: 0.25,
             sharpe_ratio: 1.0, sortino_ratio: 1.6, cvar_5: -0.04, cum_return_window: 0.28}
          # THIN: too little history.
          - {ticker: THIN, total_trading_days: 100, avg_volume: 1000000,
             daily_volatility: 0.02, annual_return: 0.30, annual_volatility: 0.25,
             sharpe_ratio: 2.0, sortino_ratio: 3.0, cvar_5: -0.04, cum_return_window: 0.28}
          # WILD: daily moves are too large.
          - {ticker: WILD, total_trading_days: 500, avg_volume: 1000000,
             daily_volatility: 0.09, annual_return: 0.30, annual_volatility: 0.25,
             sharpe_ratio: 3.0, sortino_ratio: 4.0, cvar_5: -0.04, cum_return_window: 0.28}
          # DULL: the Ichimoku trend is not bullish enough.
          - {ticker: DULL, total_trading_days: 500, avg_volume: 1000000,
             daily_volatility: 0.02, annual_return: 0.30, annual_volatility: 0.25,
             sharpe_ratio: 4.0, sortino_ratio: 5.0, cvar_5: -0.04, cum_return_window: 0.28}
          # GONE: passes every gate, but it left the index before the last date.
          - {ticker: GONE, total_trading_days: 500, avg_volume: 1000000,
             daily_volatility: 0.02, annual_return: 0.30, annual_volatility: 0.25,
             sharpe_ratio: 5.0, sortino_ratio: 6.0, cvar_5: -0.04, cum_return_window: 0.28}
      - input: ref('dim_ticker')
        rows:
          - {ticker: PASS, sector: Tech}
          - {ticker: THIN, sector: Tech}
          - {ticker: WILD, sector: Tech}
          - {ticker: DULL, sector: Tech}
          - {ticker: GONE, sector: Tech}
      - input: ref('int_ichimoku_score')
        rows:
          - {ticker: PASS, ichimoku_score: 5}
          - {ticker: THIN, ichimoku_score: 5}
          - {ticker: WILD, ichimoku_score: 5}
          - {ticker: DULL, ichimoku_score: 1}
          - {ticker: GONE, ichimoku_score: 5}
      - input: ref('stg_prices')
        rows:
          - {ticker: PASS, price_date: "2025-01-02", close: 120}
          - {ticker: THIN, price_date: "2025-01-02", close: 120}
          - {ticker: WILD, price_date: "2025-01-02", close: 120}
          - {ticker: DULL, price_date: "2025-01-02", close: 120}
          - {ticker: GONE, price_date: "2025-01-02", close: 120}
      - input: ref('stg_membership')
        rows:
          - {ticker: PASS, start_date: "2000-01-03", end_date: null}
          - {ticker: THIN, start_date: "2000-01-03", end_date: null}
          - {ticker: WILD, start_date: "2000-01-03", end_date: null}
          - {ticker: DULL, start_date: "2000-01-03", end_date: null}
          - {ticker: GONE, start_date: "2000-01-03", end_date: "2024-12-23"}
    expect:
      rows:
        - {ticker: PASS, sector: Tech, total_trading_days: 500, avg_volume: 1000000,
           daily_volatility: 0.02, annual_return: 0.30, annual_volatility: 0.25,
           sharpe_ratio: 1.0, sortino_ratio: 1.6, cvar_5: -0.04, cum_return_window: 0.28,
           ichimoku_score: 5, current_price: 120, sector_rank: 1}

  - name: test_screen_history_applies_the_gates_on_each_date
    description: >
      The screen history applies every gate on each date. It ranks the stocks
      in each sector on each date. A stock that passes later does not pass
      earlier. The top_n limit is 1 for this test.
    model: mart_screen_history
    overrides:
      vars:
        top_n_per_sector: 1
        # This test states the cum_return branch of the rank_column macro.
        # Without the override, a build with --rank-metric sharpe fails
        # this test, and the test would measure the build and not the
        # model.
        rank_metric: cum_return
    given:
      - input: ref('int_risk_metrics_daily')
        rows:
          # D1: AAA is too new. BBB passes. CCC passes in its own sector.
          - {ticker: AAA, as_of_date: "2024-01-02", total_trading_days: 100,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 3.0,
             cum_return_window: 0.90}
          - {ticker: BBB, as_of_date: "2024-01-02", total_trading_days: 500,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.40}
          - {ticker: CCC, as_of_date: "2024-01-02", total_trading_days: 500,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 0.5,
             cum_return_window: 0.20}
          # D2: AAA has enough history and the best Sharpe ratio, and BBB
          # has the best cumulative return. The screen ranks on the
          # cumulative return, so BBB wins the one Tech place, not AAA.
          # This pair is the discriminating case: under a Sharpe ranking
          # the expected rows below are wrong.
          - {ticker: AAA, as_of_date: "2025-01-02", total_trading_days: 450,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 3.0,
             cum_return_window: 0.10}
          - {ticker: BBB, as_of_date: "2025-01-02", total_trading_days: 750,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.40}
          - {ticker: CCC, as_of_date: "2025-01-02", total_trading_days: 750,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 0.5,
             cum_return_window: 0.20}
      - input: ref('int_ichimoku_score_daily')
        rows:
          - {ticker: AAA, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: BBB, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: CCC, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: AAA, as_of_date: "2025-01-02", ichimoku_score: 5}
          - {ticker: BBB, as_of_date: "2025-01-02", ichimoku_score: 5}
          # On D2, CCC is not bullish.
          - {ticker: CCC, as_of_date: "2025-01-02", ichimoku_score: 1}
      - input: ref('dim_ticker')
        rows:
          - {ticker: AAA, sector: Tech}
          - {ticker: BBB, sector: Tech}
          - {ticker: CCC, sector: Energy}
      # In this test, every stock is in the index on every date.
      - input: ref('stg_membership')
        rows:
          - {ticker: AAA, start_date: "2000-01-03", end_date: null}
          - {ticker: BBB, start_date: "2000-01-03", end_date: null}
          - {ticker: CCC, start_date: "2000-01-03", end_date: null}
    expect:
      rows:
        - {as_of_date: "2024-01-02", ticker: BBB, sector_rank: 1}
        - {as_of_date: "2024-01-02", ticker: CCC, sector_rank: 1}
        - {as_of_date: "2025-01-02", ticker: BBB, sector_rank: 1}

  - name: test_screen_history_ranks_on_the_sharpe_ratio_when_asked
    description: >
      The same fixture as the cum_return test, with rank_metric set to
      sharpe. On the second date AAA has the better Sharpe ratio and BBB
      the better cumulative return, so the two tests expect different
      stocks. The pair proves that the rank_column macro selects the
      column.
    model: mart_screen_history
    overrides:
      vars:
        top_n_per_sector: 1
        # This test states the cum_return branch of the rank_column macro.
        # Without the override, a build with --rank-metric sharpe fails
        # this test, and the test would measure the build and not the
        # model.
        rank_metric: sharpe
    given:
      - input: ref('int_risk_metrics_daily')
        rows:
          # D1: AAA is too new. BBB passes. CCC passes in its own sector.
          - {ticker: AAA, as_of_date: "2024-01-02", total_trading_days: 100,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 3.0,
             cum_return_window: 0.90}
          - {ticker: BBB, as_of_date: "2024-01-02", total_trading_days: 500,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.40}
          - {ticker: CCC, as_of_date: "2024-01-02", total_trading_days: 500,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 0.5,
             cum_return_window: 0.20}
          # D2: AAA has enough history and the best Sharpe ratio, and BBB
          # has the best cumulative return. The screen ranks on the
          # cumulative return, so BBB wins the one Tech place, not AAA.
          # This pair is the discriminating case: under a Sharpe ranking
          # the expected rows below are wrong.
          - {ticker: AAA, as_of_date: "2025-01-02", total_trading_days: 450,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 3.0,
             cum_return_window: 0.10}
          - {ticker: BBB, as_of_date: "2025-01-02", total_trading_days: 750,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.40}
          - {ticker: CCC, as_of_date: "2025-01-02", total_trading_days: 750,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 0.5,
             cum_return_window: 0.20}
      - input: ref('int_ichimoku_score_daily')
        rows:
          - {ticker: AAA, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: BBB, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: CCC, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: AAA, as_of_date: "2025-01-02", ichimoku_score: 5}
          - {ticker: BBB, as_of_date: "2025-01-02", ichimoku_score: 5}
          # On D2, CCC is not bullish.
          - {ticker: CCC, as_of_date: "2025-01-02", ichimoku_score: 1}
      - input: ref('dim_ticker')
        rows:
          - {ticker: AAA, sector: Tech}
          - {ticker: BBB, sector: Tech}
          - {ticker: CCC, sector: Energy}
      # In this test, every stock is in the index on every date.
      - input: ref('stg_membership')
        rows:
          - {ticker: AAA, start_date: "2000-01-03", end_date: null}
          - {ticker: BBB, start_date: "2000-01-03", end_date: null}
          - {ticker: CCC, start_date: "2000-01-03", end_date: null}
    expect:
      rows:
        - {as_of_date: "2024-01-02", ticker: BBB, sector_rank: 1}
        - {as_of_date: "2024-01-02", ticker: CCC, sector_rank: 1}
        - {as_of_date: "2025-01-02", ticker: AAA, sector_rank: 1}

  - name: test_screen_history_uses_index_membership_on_each_date
    description: >
      A stock passes the screen on a date only when it is in the index on
      that date. The end date is the first day out of the index.
    model: mart_screen_history
    given:
      - input: ref('int_risk_metrics_daily')
        rows:
          - {ticker: MEM, as_of_date: "2024-01-02", total_trading_days: 500,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.25}
          - {ticker: MEM, as_of_date: "2024-06-03", total_trading_days: 600,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.25}
          - {ticker: MEM, as_of_date: "2025-01-02", total_trading_days: 750,
             avg_volume: 1000000, daily_volatility: 0.02, sharpe_ratio: 1.0,
             cum_return_window: 0.25}
      - input: ref('int_ichimoku_score_daily')
        rows:
          - {ticker: MEM, as_of_date: "2024-01-02", ichimoku_score: 5}
          - {ticker: MEM, as_of_date: "2024-06-03", ichimoku_score: 5}
          - {ticker: MEM, as_of_date: "2025-01-02", ichimoku_score: 5}
      - input: ref('dim_ticker')
        rows:
          - {ticker: MEM, sector: Tech}
      # MEM joins on 2024-06-03 and leaves on 2025-01-02.
      - input: ref('stg_membership')
        rows:
          - {ticker: MEM, start_date: "2024-06-03", end_date: "2025-01-02"}
    expect:
      rows:
        - {as_of_date: "2024-06-03", ticker: MEM}

  - name: test_universe_coverage_flags_members_without_prices
    description: >
      The coverage mart lists each index member on each trading day. It flags
      a member that has no price on that day. A stock out of the index is
      not listed.
    model: mart_universe_coverage
    given:
      - input: ref('stg_prices')
        rows:
          - {ticker: SPY, price_date: "2024-01-02"}
          - {ticker: SPY, price_date: "2024-01-03"}
          - {ticker: HAS, price_date: "2024-01-02"}
          - {ticker: HAS, price_date: "2024-01-03"}
          - {ticker: OUT, price_date: "2024-01-02"}
          - {ticker: OUT, price_date: "2024-01-03"}
      - input: ref('stg_membership')
        rows:
          - {ticker: HAS, start_date: "2000-01-03", end_date: null}
          # GONE is in the index, but the price source has no data for it.
          - {ticker: GONE, start_date: "2000-01-03", end_date: "2024-01-03"}
          - {ticker: OUT, start_date: "2000-01-03", end_date: "2010-01-04"}
      - input: ref('stg_sectors')
        rows:
          - {ticker: HAS, sector: Tech}
          - {ticker: GONE, sector: Tech}
    expect:
      rows:
        - {as_of_date: "2024-01-02", ticker: HAS, has_prices: true, has_sector: true}
        - {as_of_date: "2024-01-03", ticker: HAS, has_prices: true, has_sector: true}
        - {as_of_date: "2024-01-02", ticker: GONE, has_prices: false, has_sector: true}
