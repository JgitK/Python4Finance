version: 2

models:
  - name: stg_prices
    description: >
      Clean daily prices. One row per ticker per day.
      The source is the raw prices Parquet file.
    columns:
      - name: ticker
        description: The stock symbol.
        data_tests:
          - not_null
          # The benchmark SPY has no sector, so this check does not include it.
          - relationships:
              arguments:
                to: ref('stg_sectors')
                field: ticker
              config:
                where: "ticker <> 'SPY'"
                # A few stocks have no sector. mart_universe_coverage reports them.
                severity: warn
      - name: price_date
        description: The trading day.
        data_tests:
          - not_null
      - name: close
        description: The close price. It is always more than zero.
        data_tests:
          - not_null
    # The singular test assert_unique_ticker_date.sql checks that a ticker
    # and a date together are unique. See the tests folder.

  - name: stg_sectors
    description: The GICS sector of each stock.
    columns:
      - name: ticker
        description: The stock symbol.
        data_tests:
          - not_null
          - unique
      - name: sector
        description: The GICS sector name.
        data_tests:
          - not_null

  - name: stg_membership
    description: >
      The S&P 500 membership. Each row is one stint of a stock in the index.
      The end_date is the first day out of the index. A null end_date means
      that the stock is still in the index.
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: start_date
        data_tests: [not_null]
