version: 2

models:
  - name: stg_prices
    description: >
      Clean daily prices. One row per ticker per day.
      The source is the raw prices Parquet file.
    columns:
      - name: ticker
        description: The stock symbol.
        data_tests:
          - not_null
          # The benchmark SPY has no sector, so this check does not include it.
          - relationships:
              arguments:
                to: ref('stg_sectors')
                field: ticker
              config:
                where: "ticker <> 'SPY'"
                # A few stocks have no sector. mart_universe_coverage reports them.
                severity: warn
      - name: price_date
        description: The trading day.
        data_tests:
          - not_null
      - name: close
        description: The close price. It is always more than zero.
        data_tests:
          - not_null
    # The singular test assert_unique_ticker_date.sql checks that a ticker
    # and a date together are unique. See the tests folder.

  - name: stg_sectors
    description: The GICS sector of each stock.
    columns:
      - name: ticker
        description: The stock symbol.
        data_tests:
          - not_null
          - unique
      - name: sector
        description: The GICS sector name.
        data_tests:
          - not_null

  - name: stg_membership
    description: >
      The S&P 500 membership. Each row is one stint of a stock in the index.
      The end_date is the first day out of the index. A null end_date means
      that the stock is still in the index.
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: start_date
        data_tests: [not_null]

unit_tests:
  - name: test_stg_prices_drops_excluded_tickers
    description: >
      Some price histories belong to a different security, for example after
      a ticker is used again. The exclusions seed lists these tickers. The
      staging model drops all of their rows.
    model: stg_prices
    given:
      # The source is a Parquet file, not a table, so this input is SQL with types.
      - input: source('raw', 'prices')
        format: sql
        rows: |
          select 'GOOD' as ticker, date '2024-01-02' as date, 10.0 as open,
                 11.0 as high, 9.0 as low, 10.0 as close, 1000000::bigint as volume
          union all
          select 'REUSED', date '2024-01-02', 9000.0, 9000.0, 9000.0, 9000.0, 80::bigint
      - input: ref('price_data_exclusions')
        rows:
          - {ticker: REUSED, reason: "The ticker now names a different security."}
    expect:
      rows:
        - {ticker: GOOD, price_date: "2024-01-02", close: 10}
